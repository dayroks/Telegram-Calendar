<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Розумний Календар</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="month-year" id="monthYear">Завантаження...</div>
        <div class="nav-buttons">
            <button id="prevBtn">‹</button>
            <button id="nextBtn">›</button>
        </div>
    </div>

    <div class="weekdays">
        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Нд</div>
    </div>

    <div class="days-grid" id="daysGrid"></div>

    <div class="events-section">
        <div class="events-date" id="eventsDate">Оберіть день</div>
        <div id="eventsList"></div>
        
        <button class="action-btn" id="addSingleBtn">+ Додати на цей день</button>
        <button class="action-btn outline" id="openManageCyclesBtn">📂 Мої циклічні розклади</button>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО 1: Додавання звичайної події -->
    <div class="modal" id="singleEventModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-top:0;">Нова подія</h3>
            <input type="text" id="eventText" placeholder="Назва (напр. Зустріч)">
            <input type="time" id="eventTime" value="12:00">
            <button class="action-btn" id="saveSingleEventBtn">Зберегти</button>
            <button class="action-btn outline" id="cancelSingleEventBtn" style="margin-top:8px;">Скасувати</button>
        </div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО 2: Список циклів -->
    <div class="modal" id="manageCyclesModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Мої розклади</h3>
            <div id="cyclesList" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
            <button class="action-btn" id="createNewCycleBtn">+ Створити новий</button>
            <button class="action-btn outline" id="closeManageCyclesBtn" style="margin-top:8px;">Закрити</button>
        </div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО 3: Редактор конкретного циклу -->
    <div class="modal" id="cycleEditorModal">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <h3 id="cycleEditorTitle" style="margin-top:0;">Новий розклад</h3>
            <input type="text" id="cycleNameInput" placeholder="Назва (напр. Школа)">
            
            <div class="weekday-selector" id="cycleDaysTabs">
                <button class="wd-btn active" data-day="1">Пн</button>
                <button class="wd-btn" data-day="2">Вт</button>
                <button class="wd-btn" data-day="3">Ср</button>
                <button class="wd-btn" data-day="4">Чт</button>
                <button class="wd-btn" data-day="5">Пт</button>
                <button class="wd-btn" data-day="6">Сб</button>
                <button class="wd-btn" data-day="0">Нд</button>
            </div>

            <div id="dayEventsEditor" style="background: var(--secondary-bg); padding: 10px; border-radius: 10px; margin-bottom: 15px; min-height: 80px;">
                <!-- Тут будуть події вибраного дня -->
            </div>

            <button class="action-btn outline" id="addEventToCycleBtn" style="margin-bottom: 15px;">+ Додати предмет/справу</button>
            <button class="action-btn" id="saveCycleBtn">Зберегти розклад</button>
            <button class="action-btn outline" id="cancelCycleBtn" style="margin-top:8px;">Скасувати</button>
        </div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО 4: Додавання події ВСЕРЕДИНІ циклу (заміна prompt) -->
    <div class="modal" id="addCycleEventModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Додати в розклад</h3>
            <input type="text" id="cycleEventText" placeholder="Назва (напр. Математика)">
            <input type="time" id="cycleEventTime" value="08:30">
            <button class="action-btn" id="saveCycleEventBtn">Додати</button>
            <button class="action-btn outline" id="cancelCycleEventBtn" style="margin-top:8px;">Скасувати</button>
        </div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО 5: Кастомне підтвердження видалення (заміна confirm) -->
    <div class="modal" id="confirmModal">
        <div class="modal-content" style="text-align: center;">
            <h3 id="confirmTitle" style="margin-top:0;">Видалити?</h3>
            <p id="confirmText" style="color: var(--hint-color); font-size: 14px; margin-bottom: 20px;">Цю дію неможливо скасувати.</p>
            <button class="action-btn" style="background: var(--danger-color);" id="confirmYesBtn">Видалити</button>
            <button class="action-btn outline" id="confirmNoBtn" style="margin-top:8px;">Скасувати</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
